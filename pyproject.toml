[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-analysis"
version = "4.0.0"
description = "Python pipeline engine for analysis workflows with conda environment switching"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
workflows = [
    "numpy>=1.24",
    "scikit-image>=0.23",
    "pooch>=1.8",
    "tifffile>=2024.0",
    "imagecodecs>=2024.0",
]
test = [
    "pytest>=8.0",
    "psutil>=5.9",
    "numpy>=1.24",
    "scikit-image>=0.23",
    "pooch>=1.8",
    "tifffile>=2024.0",
    "imagecodecs>=2024.0",
]
dev = [
    "smart-analysis[test]",
]

[project.urls]
Repository = "https://github.com/thomdehoog/smart-analysis"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = [
    "engine",
    "workflows",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: end-to-end tests using real YAML pipelines through the v4 API",
    "robustness: edge cases, error recovery, resource cleanup",
    "adversarial: stress / race-condition / corruption / protocol-attack tests",
    "slow: tests that take more than ~5s individually",
    "cellpose: requires real cellpose + skimage in the active env",
    "conda_env: requires SMART--basic_test--env_a conda env",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
# Avoid pytest walking up to drives where it cannot read parent dirs
# (Windows network shares). The rootdir is fixed to the repo.
