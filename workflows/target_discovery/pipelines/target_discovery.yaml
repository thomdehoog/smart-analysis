# Select revisit targets from an aggregated object-detection overview.

metadata:
  purpose: "Target discovery from object tables"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

target_discovery:
  - discover_targets:
      feature: "area"
      direction: "high"
      n_per_tile: 5
      border_margin_px: 0
      area_threshold: null
      intensity_threshold: null
