# Cluster objects from an aggregated object-analysis overview, then select targets.

metadata:
  purpose: "Target discovery with embedding clustering"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

target_discovery:
  - cluster_objects:
      cluster_mode: "manual"   # "manual" or "auto"
      n_neighbors: 15
      leiden_resolution: 1.0
      auto_resolution_grid: [0.05, 0.1, 0.2, 0.4, 0.7, 1.0, 1.5, 2.0, 3.0, 5.0]
      auto_refine_steps: 2
      auto_stability_repeats: 3
      auto_max_cluster_fraction: 0.95
      auto_min_cluster_size: 2
      auto_max_tiny_cluster_fraction: 0.30
      random_state: 0
      umap_n_neighbors: 30
      umap_min_dist: 0.4
      umap_metric: "euclidean"   # euclidean (default) or cosine
      output_dir: null

  - select_targets:
      feature: "area"
      direction: "high"
      n_per_tile: 5
      border_margin_px: 0
      area_threshold: null
      intensity_threshold: null
