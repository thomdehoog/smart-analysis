# Cell Analysis Pipeline
#
# Generic cell analysis: load image, segment with Cellpose, measure
# regionprops, select cells matching a criterion. The output is a
# list of selected cell labels with their properties, ready to feed
# downstream tools (visualisation, acquisition feedback, CSV export).

metadata:
  purpose: "Segment cells, extract features, select cells of interest"
  version: "1.0"
  verbose: 2
  functions_dir: "../steps"

cell_analysis:

  - preprocess:
      sigma: 1.0
      clip_limit: 0.03

  - segment:
      diameter: null    # let Cellpose auto-estimate
      gpu: true

  - extract_features:
      # Uses extract_features.DEFAULT_PROPERTIES plus derived columns:
      # circularity, aspect_ratio, orientation_deg, intensity_total,
      # intensity_cv. Override `properties:` to trim the native set.
      # Add `extras: [intensity, neighbourhood, texture, morphology]` or
      # `extras: [all]` to opt in to optional feature groups.
      # Pass `pixel_size_um: [dy, dx]` to get area/perimeter/axes in um.

  - select_features:
      feature: "area"
      mode: "percentile"     # percentile | threshold | top_n
      percentile: 95
      direction: "high"      # high | low
