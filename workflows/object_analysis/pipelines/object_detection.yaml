# Object detection checkpoint for one acquired image tile.

metadata:
  purpose: "Object detection checkpoint"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

object_detection:
  - detect_objects:
      channels: null
      cellprob_threshold: 0.0
      flow_threshold: 0.4
      niter: null
      diameter: null
      max_segmentation_size_px: 512
      min_area_px: 1000
      max_area_px: null
      gpu: true
      persist_only: true
