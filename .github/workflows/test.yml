name: Tests

on:
  push:
    branches: [main, v4-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    defaults:
      run:
        # `bash -el {0}` ensures conda activation works on every step,
        # including on Windows runners (where `bash` is git-bash by default).
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: orchestrator
          auto-activate-base: false
          miniforge-version: latest

      - name: Show environment
        run: |
          python --version
          conda --version
          which python

      - name: Install package with test deps
        run: pip install -e .[test]

      - name: Run pytest
        # Skip markers that require resources we don't provision in CI:
        #   cellpose   -- needs cellpose + torch + skimage installed
        #   deep       -- needs torch / DINO model access
        #   cluster    -- needs kNN / Leiden / UMAP env
        #   conda_env  -- needs SMART--basic_test--env_a/b/c conda envs
        run: pytest -m "not cellpose and not deep and not cluster and not conda_env" --tb=short
