# Two phases:
#   Phase 0  tile           runs once per submit()
#   Phase 1  stitch         runs once per scope group, when completed
#
# The 'scope: group' line makes 'stitch' a scoped step. It will fire when
# the caller submits a job tagged scope={"group": ...} with complete="group".

metadata:
  functions_dir: "./steps"
  verbose: 0

scoped-aggregation:
  - tile:

  - stitch:
      scope: group
